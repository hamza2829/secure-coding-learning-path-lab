[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "secure-coding-learning-path-lab"
version = "0.1.0"
description = "Plan secure coding training, compare costs, and export a Basic LMS assignment"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["openpyxl>=3.1,<4", "PyYAML>=6,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1"]

[project.scripts]
secure-path = "secure_path.cli:main"

[tool.setuptools.package-data]
secure_path = ["overview.css"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.coverage.report]
precision = 2
